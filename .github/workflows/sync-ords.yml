name: Sync ORDS to MongoDB Atlas (Local Network)

on:
  schedule:
    # يتم التحديث تلقائياً كل 15 دقيقة
    - cron: '*/15 * * * *'
  workflow_dispatch: # يتيح التشغيل اليدوي متى شئت

jobs:
  sync:
    runs-on: self-hosted  # استخدام السيرفر المحلي للوصول لشبكة Intranet
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pymongo dnspython

      - name: Run Sync Script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python -c "
          import os, requests
          from pymongo import MongoClient

          try:
              mongo_uri = os.environ.get('MONGO_URI')
              if not mongo_uri:
                  raise Exception('MONGO_URI secret is missing!')

              client = MongoClient(mongo_uri)
              db = client['transport']
              collection = db['bus_data']

              # طلب بيانات ORDS عبر الشبكة الداخلية للشركة
              ords_url = 'http://197.3.5.106:9280/ords/ti/exploitation/AFFICHEUR_RAED'
              items = []
              
              try:
                  response = requests.get(ords_url, timeout=15)
                  if response.status_code == 200:
                      data = response.json()
                      # تحليل مرن لاستجابة الـ JSON
                      if isinstance(data, dict):
                          items = data.get('items', [])
                          if not items and len(data) > 0:
                              items = [data]
                      elif isinstance(data, list):
                          items = data
                  else:
                      print(f'ORDS Error code: {response.status_code}')
              except Exception as ords_err:
                  print(f'Could not reach ORDS: {ords_err}')

              # إذا كانت البيانات فارغة، أدخل سجل تجريبي (Test) للتأكد من الاتصال
              if not items:
                  print('ORDS data is empty or unreachable. Inserting TEST record...')
                  items = [{
                      'ligne': 'TEST-99',
                      'destination': 'Sfax Test Destination',
                      'bus_id': 'BUS-TEST-01',
                      'horaire': '12:00',
                      'statut': 'Test Active',
                      'latitude': 34.7406,
                      'longitude': 10.7600
                  }]

              # تفريغ البيانات القديمة ثم إدخال المحدثة في MongoDB
              collection.delete_many({})
              if isinstance(items, list) and len(items) > 0:
                  collection.insert_many(items)
                  print(f'Sync success! Inserted {len(items)} records.')
              else:
                  collection.insert_one(items)
                  print('Sync success! Inserted 1 record.')

          except Exception as e:
              print(f'Execution Error: {e}')
          "
